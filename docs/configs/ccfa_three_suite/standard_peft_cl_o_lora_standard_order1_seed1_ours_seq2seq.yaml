# Ours-only T5-large seq2seq adapter for the O-LoRA standard CL order1 stream.
experiment_name: ccfa_v2_o_lora_standard_order1_seed1_ours_seq2seq
mode: ours
seed: 1
paths:
  project_root: /root/Lora-Baselines
  processed_stream_dir: /root/autodl-tmp/lora-baselines-run_v1/data/ccfa_three_suite/standard_peft
  processed_stream_file: olora_standard_order1_t5large.json
  results_dir: /root/autodl-tmp/lora-baselines-run_v1/results
data:
  suite: Standard PEFT CL
  benchmark: O-LoRA standard order1
  stream_format: unified_ccfa_stream
  ready: smoke_ready
model:
  architecture: seq2seq_lm
  task_type: seq2seq_lm
  backbone: t5-large
  hf_model_name_or_path: /root/autodl-tmp/model_cache/hf_snapshots/t5-large
  torch_dtype: bfloat16
  device: auto
  max_source_len: 512
  max_target_len: 64
  gen_max_new_tokens: 32
  gen_num_beams: 1
  gen_do_sample: false
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q", "v"]
train:
  lr: 0.0001
  epochs_per_segment: 1
  batch_size: 1
  hard_early_stop_enabled: false
modules:
  use_drift_detector: true
  use_lora_bank: true
  use_router: true
  use_overlap_loss: true
eval_normalization:
  enable_task_aware_score: true
  auto_short_answer_max_new_tokens: true
output:
  run_name: ccfa_v2_o_lora_standard_order1_seed1_ours_seq2seq
  tracking:
    use_wandb: false
paper:
  ready: smoke_ready
  metrics: ["final_average_accuracy", "per-task accuracy matrix", "forgetting", "BWT"]
  postprocess: ccfa_postprocess/summary.json
